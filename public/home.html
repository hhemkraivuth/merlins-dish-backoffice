<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — The Pit</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .wide { max-width: 1000px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    .status.err { color: var(--flag); }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
    .topline h2 { font-size: 18px; margin: 0; }
    .topline button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--blue); color: #fff; cursor: pointer; }
    .office { position: relative; width: 100%; max-width: 760px; margin: 0 auto 18px; border: 3px solid var(--blue); border-radius: 12px; overflow: hidden; background: #e3e4e8; }
    .office svg { display: block; width: 100%; aspect-ratio: 192 / 120; }
    .office .plate { position: absolute; transform: translate(-50%, -100%); font: inherit; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 8px; border: 0; border-radius: 6px; background: var(--yellow); color: var(--blue); cursor: pointer; white-space: nowrap; }
    @media (min-width: 600px) { .office .plate { font-size: 13px; padding: 5px 10px; } }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .team { background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--red); border-radius: 12px; padding: 12px 14px 12px; }
    .team:nth-child(even) { border-top-color: var(--blue); }
    .team.flash { box-shadow: 0 0 0 3px var(--yellow); }
    .tlink { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
    .tname { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .top { font-size: 26px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
    .line { font-size: 16px; font-weight: 600; }
    .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .note.stale { color: var(--red); font-weight: 600; }
    details.rest { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
    details.rest summary { font-size: 13px; font-weight: 600; color: var(--blue); cursor: pointer; }
    details.rest .n { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 10px; background: var(--teal); color: var(--ink); text-align: center; font-weight: 700; }
    .ho { font-size: 13px; line-height: 1.35; margin: 8px 0 0; }
    .ho .who { display: block; font-size: 11px; color: var(--muted); }
    .week { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    @media (max-width: 600px) { .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; } .tab-bar .tab-button { flex: 0 0 auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">The Pit</div>
          <div class="subtitle">What each team is doing right now.</div>
        </div>
      </div>
    </header>

    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Commands</a>
      <a class="tab-button tab-link active" href="home.html">Home</a>
      <a class="tab-button tab-link" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Weekly Receipts</a>
      <a class="tab-button tab-link" href="/#batchcook">Batch Cook</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link" href="analysis.html">Analysis</a>
    </nav>

    <main class="main wide">
      <div class="topline">
        <div>
          <h2 id="today">The Pit</h2>
        </div>
        <button id="reload">Refresh</button>
      </div>
      <div class="office" id="office"></div>
      <div class="status" id="status">Loading…</div>
      <p class="week">This week, Sunday to Saturday. Tap a card for the detail.</p>
      <section class="shop-box" id="stockBox"><h2>Stock left</h2><div id="stockLeft"></div></section>
      <section class="shop-box" id="shopBox"><h2>Shopping plan</h2><div id="shopPlan"></div></section>
      <div class="grid" id="teams"></div>
    </main>
  </div>
  <script src="office.js"></script>
  <script src="shopping.js"></script>
  <script src="home.js"></script>
</body>
</html>
