<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — The Pit</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .wide { max-width: 1000px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    .status.err { color: var(--flag); }
    .topline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 14px; flex-wrap: wrap; }
    .topline h2 { font-size: 18px; margin: 0; }
    .topline .meta { font-size: 14px; color: var(--muted); }
    .topline button { font: inherit; font-size: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
    .team { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .teamtop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .team h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
    .team .when { font-size: 12px; color: var(--muted); text-align: right; }
    .team .latest { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 6px 0 2px; }
    .team .sub { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
    .team .clear { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    details.rest { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
    details.rest summary { font-size: 14px; color: var(--accent); cursor: pointer; }
    details.rest .n { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--flag); color: var(--card); text-align: center; font-weight: 600; }
    .ho { font-size: 14px; line-height: 1.4; margin: 8px 0 0; }
    .ho .who { display: block; font-size: 12px; color: var(--muted); }
    ul.more { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.45; }
    ul.more li { margin-bottom: 4px; }
    .office { position: relative; width: 100%; max-width: 760px; margin: 0 auto 16px; border: 3px solid #7c5c3e; border-radius: 10px; overflow: hidden; background: #efe6d6; }
    .office canvas { display: block; width: 100%; aspect-ratio: 192 / 120; image-rendering: pixelated; }
    .office .plate { position: absolute; transform: translate(-50%, -100%); font: inherit; font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 7px; border: 1px solid #7c5c3e; border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
    .office .plate .n { margin-left: 4px; padding: 1px 5px; border-radius: 8px; background: var(--flag); color: var(--card); }
    @media (min-width: 600px) { .office .plate { font-size: 13px; padding: 5px 10px; } }
    .team.flash { box-shadow: 0 0 0 3px #f2c230; }
    @media (max-width: 600px) { .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; } .tab-bar .tab-button { flex: 0 0 auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <span class="logo-mark">MD</span>
        <div>
          <div class="title">The Pit</div>
          <div class="subtitle">What each team is doing right now.</div>
        </div>
      </div>
    </header>

    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Commands</a>
      <a class="tab-button tab-link active" href="home.html">Home</a>
      <a class="tab-button tab-link" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Weekly Receipts</a>
      <a class="tab-button tab-link" href="/#batchcook">Batch Cook</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
    </nav>

    <main class="main wide">
      <div class="topline">
        <div>
          <h2 id="today">The Pit</h2>
          <div class="meta" id="openTotal"></div>
        </div>
        <button id="reload">Refresh</button>
      </div>
      <div class="office" id="office"></div>
      <div class="status" id="status">Loading…</div>
      <div class="grid" id="teams"></div>
    </main>
  </div>
  <script src="office.js"></script>
  <script src="home.js"></script>
</body>
</html>
