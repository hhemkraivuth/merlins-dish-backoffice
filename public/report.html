<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — Full report</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Merlin's BOH" />
  <style>
    .wide { max-width: 1000px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    .status.err { color: var(--flag); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
    .bar a, .bar button { font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
    .bar .on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .bar .go { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tabs2 { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; margin-bottom: 8px; }
    .tabs2 button { flex: 0 0 auto; white-space: nowrap; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .tabs2 button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .doc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .doc h2 { font-size: 22px; margin: 4px 0 10px; } .doc h3 { font-size: 19px; margin: 22px 0 8px; } .doc h4, .doc h5 { font-size: 16px; margin: 16px 0 6px; }
    .doc p { margin: 0 0 10px; } .doc ul, .doc ol { margin: 0 0 10px; padding-left: 22px; } .doc li { margin-bottom: 4px; }
    .doc hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .doc code { background: #F3ECE4; padding: 1px 5px; border-radius: 4px; font-size: 14px; }
    .doc a { color: var(--blue); }
    .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 10px; }
    .doc table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
    .doc th, .doc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .doc th { background: #FFF7EE; white-space: nowrap; }
    .stamp { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    @media print { .header, .tab-bar, .bar, .tabs2, .status { display: none !important; } .doc { border: 0; padding: 0; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">Full report</div>
          <div class="subtitle">The complete Sunday check, with every table.</div>
        </div>
      </div>
    </header>
    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Index</a>
      <a class="tab-button tab-link" href="home.html">Home</a>
      <a class="tab-button tab-link active" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Purchasing Receipts</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="/#batchcook">Kitchen Production</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link" href="analysis.html">Analysis</a>
    </nav>
    <main class="main wide">
      <div class="bar"><a href="marketing.html">Back to Marketing</a><button type="button" class="go" id="dl">Download</button><button type="button" id="pr">Print or save as PDF</button></div>
      <div class="status" id="status">Loading…</div>
      <div class="tabs2" id="tabs"></div>
      <article class="doc" id="doc"></article>
      <p class="stamp" id="stamp"></p>
    </main>
  </div>
  <script src="md.js"></script>
  <script src="report.js"></script>
</body>
</html>
