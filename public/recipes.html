<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — Recipes</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .wide { max-width: 760px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin: 8px 0; }
    .status.err { color: var(--flag); }
    a.back { display: inline-block; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; padding: 10px 18px; border-radius: 999px; }
    .backrow { margin: 4px 0 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chips button { font: inherit; font-size: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); cursor: pointer; }
    .chips button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 10px 0 4px; }
    .facts div span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .facts div b { font-size: 18px; }
    h2.sec { font-size: 15px; margin: 18px 0 6px; }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    td.r, th.r { text-align: right; white-space: nowrap; }
    td small { display: block; font-size: 12px; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    @media print { .tab-bar, .header, .chips, .backrow { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">Recipes</div>
          <div class="subtitle">The standard recipe for each batch dish.</div>
        </div>
      </div>
    </header>
    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Commands</a>
      <a class="tab-button tab-link" href="home.html">Home</a>
      <a class="tab-button tab-link" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Weekly Receipts</a>
      <a class="tab-button tab-link active" href="/#batchcook">Batch Cook</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link" href="analysis.html">Analysis</a>
    </nav>
    <main class="main wide">
      <div class="backrow"><a class="back" href="/#batchcook">Back to Batch Cook</a></div>
      <div class="chips" id="chips"></div>
      <div class="status" id="status"></div>
      <div id="recipe"></div>
      <div class="backrow" style="margin-top:18px"><a class="back" href="/#batchcook">Back to Batch Cook</a></div>
    </main>
  </div>
  <script src="recipes.js"></script>
</body>
</html>
