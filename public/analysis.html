<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — Business Analysis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Merlin's BOH" />
  <style>
    .wide { max-width: 1000px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; white-space: pre-line; }
    .status.err { color: var(--flag); }
    .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 4px 0 12px; }
    .toggle button { font: inherit; font-size: 14px; padding: 8px 18px; border: 0; background: var(--card); color: var(--ink); cursor: pointer; }
    .toggle button.on { background: var(--blue); color: #fff; font-weight: 600; }
    .period { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 12px; font-size: 14px; }
    .period select, .period input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .period .why { font-size: 12px; color: var(--muted); }
    .chart-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
    .chart-card h2 { font-size: 15px; margin: 0 0 2px; }
    .chart-card .why { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
    .readout { font-size: 13px; min-height: 38px; padding: 6px 10px; margin: 0 0 6px; background: #fbf3e8; border-radius: 8px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; }
    .readout span i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
    .readout b { color: var(--ink); }
    .cc svg { cursor: crosshair; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .notes { font-size: 14px; margin: 0 0 14px; padding-left: 18px; }
    .ideas li { margin-bottom: 4px; }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    th { font-weight: 600; color: var(--muted); }
    @media (max-width: 600px) { .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; } .tab-bar .tab-button { flex: 0 0 auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">Business Analysis</div>
          <div class="subtitle">How each month and week is performing, from the first order in Nov 2025.</div>
        </div>
      </div>
    </header>
    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Index</a>
      <a class="tab-button tab-link" href="home.html">Home</a>
      <a class="tab-button tab-link" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Purchasing Receipts</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="/#batchcook">Kitchen Production</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link active" href="analysis.html">Analysis</a>
    </nav>
    <main class="main wide">
      <div class="status" id="status">Loading…</div>
      <div id="monday"></div>
      <div class="toggle" id="toggle"><button data-k="weeks">Weekly (Sun to Sat)</button><button data-k="months" class="on">Monthly</button></div>
      <div class="period" id="range"><label>Period <select id="preset"><option>Loading…</option></select></label> <label>From <input type="date" id="pfrom" /></label> <label>To <input type="date" id="pto" /></label><span class="why">Applies to every section below.</span></div>
      <ul class="notes" id="notes"></ul>
      <div id="when"></div>
      <div id="charts"></div>
      <h2 style="font-size:16px">The numbers behind the graphs</h2>
      <div class="tablewrap" id="tableBox"></div>
      <div id="mix"></div>
      <div id="deep"></div>
      <div id="check"></div>
    </main>
  </div>
  <script src="analysis.js"></script>
  <script src="briefing.js"></script>
</body>
</html>
