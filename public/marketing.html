<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — Marketing</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .wide { max-width: 1000px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    .status.err { color: var(--flag); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
    .box h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--muted); }
    .big { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; }
    .sub { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
    .due { color: var(--flag); font-weight: 600; }
    .note { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; line-height: 1.4; }
    .note b { display: block; font-size: 15px; }
    .note small { color: var(--muted); }
    .draft { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--flag); color: var(--card); margin-left: 6px; }
    form.add { display: grid; gap: 8px; }
    form.add select, form.add input, form.add textarea { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); width: 100%; box-sizing: border-box; }
    form.add button { font: inherit; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--card); font-weight: 600; cursor: pointer; }
    details > summary { cursor: pointer; font-size: 15px; font-weight: 600; padding: 6px 0; }
    @media (max-width: 600px) { .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; } .tab-bar .tab-button { flex: 0 0 auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">Marketing</div>
          <div class="subtitle">Sales, competitors, ideas and ad drafts.</div>
        </div>
      </div>
    </header>
    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Commands</a>
      <a class="tab-button tab-link" href="home.html">Home</a>
      <a class="tab-button tab-link active" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Weekly Receipts</a>
      <a class="tab-button tab-link" href="/#batchcook">Batch Cook</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link" href="analysis.html">Analysis</a>
    </nav>
    <main class="main wide">
      <div class="status" id="status">Loading…</div>
      <div class="grid" id="top"></div>
      <p><button type="button" id="dlNotes" style="font:inherit;font-size:13px;padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--card);font-weight:600;cursor:pointer">Download all notes (CSV)</button></p>
      <div id="sections"></div>
      <details class="box"><summary>Add a note by hand</summary>
        <h3>&nbsp;</h3>
        <form class="add" id="addForm">
          <select id="kind"></select>
          <input id="title" placeholder="Short title" required />
          <textarea id="note" rows="3" placeholder="Details, prices, links"></textarea>
          <button type="submit">Save note</button>
        </form>
        <p class="sub" id="addStatus"></p>
      </details>
    </main>
  </div>
  <script src="marketing.js"></script>
</body>
</html>
