<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin's Dish — Audit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Merlin's BOH" />
  <style>
    .wide { max-width: 760px; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    .status.err { color: var(--flag); }
    .light { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
    .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; background: #2e8b6e; }
    .dot.amber { background: #f0a020; } .dot.red { background: #d9392b; }
    .light b { font-size: 18px; display: block; } .light span { font-size: 13px; color: var(--muted); }
    .find { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--yellow); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
    .find .tagc { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .find p { margin: 3px 0 6px; font-size: 15px; line-height: 1.35; }
    .find .at { font-weight: 700; color: var(--flag); }
    .find .acts { display: flex; gap: 8px; }
    .find .acts a, .find .acts button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; }
    .find .acts a { background: var(--blue); color: #fff; border-color: var(--blue); }
    .fixrow { display: flex; gap: 8px; align-items: flex-end; margin: 4px 0 8px; }
    .fixrow label { flex: 1; font-size: 12px; color: var(--muted); }
    .fixrow select { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 3px; background: #fff; color: var(--ink); }
    .fixrow input { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 3px; background: #fff; color: var(--ink); }
    .find .acts .primary, .fixrow .primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .fixrow .primary { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--blue); cursor: pointer; white-space: nowrap; }
    .facts { border-collapse: collapse; margin: 2px 0 6px; font-size: 15px; }
    .facts td { padding: 2px 18px 2px 0; }
    .facts td:last-child { font-weight: 700; padding-right: 0; }
    .find .punch { font-weight: 700; color: var(--flag); margin: 0 0 8px; }
    .find .chips .rsn { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    .find .bul { margin: 0 0 8px; padding-left: 18px; font-size: 14px; line-height: 1.5; }
    .fixrow { flex-wrap: wrap; }
    .grp { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--yellow); border-radius: 10px; padding: 8px 12px; margin: 0 0 8px; }
    .grp .gtag { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .grp .gtag span { background: var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
    .grp .find { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 8px 0 4px; margin: 6px 0 0; background: none; }
    .grp .find:first-of-type { border-top: 0; margin-top: 0; padding-top: 2px; }
    .grp .find .tagc { display: none; }
    .grp .find p { margin: 0 0 6px; }
    .fixrow button { align-self: flex-end; }
    .find .how { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
    .find .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .find .chips a { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--blue); text-decoration: none; }
    .itm { border-top: 1px solid var(--line); padding: 8px 0 4px; }
    .itm .t { font-size: 14px; margin-bottom: 4px; }
    .itm .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .itm input { flex: 1; min-width: 130px; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
    .itm button { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; white-space: nowrap; }
    .itm button.del { background: #fff; color: var(--flag); border-color: var(--flag); }
    .itm .m { font-size: 12px; color: var(--flag); width: 100%; }
    .fmsg { font-size: 12px; color: var(--flag); min-height: 0; margin-top: 4px; }
    .clear { text-align: center; padding: 26px 10px; color: var(--muted); }
    @media (max-width: 600px) { .tab-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; } .tab-bar .tab-button { flex: 0 0 auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a class="logo-mark" href="home.html" aria-label="Merlin's Dish, go to The Pit"><img src="logo.png?v=33" alt="Merlin's Dish" /></a>
        <div>
          <div class="title">Audit</div>
          <div class="subtitle">The pig in glasses checks the books every night at 5:00am.</div>
        </div>
      </div>
    </header>
    <nav class="tab-bar" id="tabBar">
      <a class="tab-button tab-link" href="commands.html">Index</a>
      <a class="tab-button tab-link" href="home.html">Home</a>
      <a class="tab-button tab-link" href="marketing.html">Marketing</a>
      <a class="tab-button tab-link" href="/#receipts">Purchasing Receipts</a>
      <a class="tab-button tab-link" href="/#stock">Stock Counts</a>
      <a class="tab-button tab-link" href="/#batchcook">Kitchen Production</a>
      <a class="tab-button tab-link" href="reports.html">Numbers</a>
      <a class="tab-button tab-link" href="customers.html">Customers</a>
      <a class="tab-button tab-link" href="analysis.html">Analysis</a>
    </nav>
    <main class="main wide">
      <div class="topline"><h2>To review</h2><button id="run" type="button">Check now</button></div>
      <div id="status" class="status">Loading…</div>
      <div id="light" class="light"></div>
      <div id="list"></div>
    </main>
  </div>
  <script src="audit.js"></script>
</body>
</html>
